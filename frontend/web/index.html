<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>HostSpawn</title>
<style>
  :root {
    --bg: #07090d; --bg2: #0b0f16; --panel: rgba(17, 22, 31, .78); --panel2: rgba(26, 33, 45, .7);
    --line: rgba(148, 163, 184, .12); --line2: rgba(148, 163, 184, .22);
    --text: #e6edf6; --muted: #8b97a8; --dim: #5d6878;
    --accent: #3ee6c4; --accent2: #7c5cff; --glow: rgba(62, 230, 196, .35);
    --ok: #3ddc97; --warn: #f5b74f; --bad: #ff5c7a; --info: #5cb8ff;
    --r: 14px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14.5px/1.5 Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {  /* soft glow + faint grid */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(124, 92, 255, .16), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(62, 230, 196, .10), transparent 60%),
      linear-gradient(rgba(148,163,184,.035) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(148,163,184,.035) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--bg);
  }
  a { color: var(--accent); text-decoration: none; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

  /* ---- sidebar ---- */
  nav.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(11, 15, 22, .9), rgba(7, 9, 13, .9)); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 18px; }
  .brand svg { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 18px -4px var(--glow); }
  .brand b { font-size: 17px; letter-spacing: .3px; }
  .brand small { display: block; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .4px; }
  .navlink { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: var(--muted);
    font-weight: 500; transition: background .15s, color .15s; }
  .navlink svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
  .navlink:hover { background: rgba(148,163,184,.07); color: var(--text); }
  .navlink.on { background: linear-gradient(90deg, rgba(62,230,196,.14), rgba(62,230,196,.02)); color: var(--text);
    box-shadow: inset 2px 0 0 var(--accent); }
  .navlink .count { margin-left: auto; font: 600 11px var(--mono); color: var(--accent); background: rgba(62,230,196,.1);
    padding: 1px 7px; border-radius: 99px; }
  .side .foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .side .foot div { display: flex; justify-content: space-between; padding: 2px 0; }
  .side .foot b { color: var(--muted); font: 500 12px var(--mono); }

  main { padding: 28px 34px 60px; min-width: 0; max-width: 1400px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .head h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.3px; }
  .head p { margin: 4px 0 0; color: var(--muted); }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .crumb a { color: var(--muted); } .crumb a:hover { color: var(--accent); }
  .mode { font: 700 11px var(--mono); letter-spacing: 1px; padding: 4px 9px; border-radius: 6px; vertical-align: middle; }
  .mode-live { color: var(--ok); background: rgba(61,220,151,.1); box-shadow: inset 0 0 0 1px rgba(61,220,151,.3); }
  .mode-dev { color: var(--warn); background: rgba(245,183,79,.1); box-shadow: inset 0 0 0 1px rgba(245,183,79,.3); }
  .banner { border: 1px solid rgba(245,183,79,.3); background: rgba(245,183,79,.07); color: var(--warn); border-radius: 12px;
    padding: 11px 15px; margin-bottom: 18px; font-size: 13.5px; }

  /* ---- surfaces ---- */
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px;
    backdrop-filter: blur(16px); min-width: 0; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .card h2, .card h3 { margin: 0; font-weight: 620; }
  .card h2 { font-size: 16px; } .card h3 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-size: 11.5px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .stack { display: grid; gap: 16px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }

  /* status pill */
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; padding: 4px 10px 4px 9px;
    border-radius: 99px; background: rgba(148,163,184,.08); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .s-running { color: var(--ok); } .s-starting, .s-stopping { color: var(--warn); }
  .s-starting i, .s-stopping i { animation: pulse 1.2s infinite; }
  .s-stopped, .s-unknown { color: var(--bad); } .s-maintenance, .s-not_installed { color: var(--muted); }
  .s-maintenance i, .s-not_installed i { box-shadow: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .gameicon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none;
    font: 700 13px var(--mono); color: #061013; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  .stat .k { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; }
  .stat .v { font: 600 17px var(--mono); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 3px; border-radius: 3px; background: rgba(148,163,184,.12); overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); opacity: .5; flex: none; }
  .dot.ok { background: var(--ok); opacity: 1; box-shadow: 0 0 8px rgba(61,220,151,.6); }
  .dot.bad { background: var(--bad); opacity: 1; box-shadow: 0 0 8px rgba(255,92,122,.6); }
  .dot.warn { background: var(--warn); opacity: 1; }
  .flags { list-style: none; margin: 0 0 12px; padding: 0; }
  .flags li { color: var(--warn); font-size: 12.5px; padding: 3px 0 3px 18px; position: relative; }
  .flags li::before { content: "▲"; position: absolute; left: 2px; font-size: 9px; top: 6px; }

  /* buttons + inputs */
  button, .btn { font: inherit; font-size: 13.5px; font-weight: 550; color: var(--text); background: rgba(148,163,184,.08);
    border: 1px solid var(--line2); border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 38px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all .15s; }
  button:hover { border-color: rgba(62,230,196,.5); background: rgba(62,230,196,.08); }
  button:active { transform: translateY(1px); }
  button.primary { color: #041311; border: 0; background: linear-gradient(135deg, var(--accent), #2bc3e6);
    box-shadow: 0 6px 22px -6px var(--glow); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--bad); border-color: rgba(255,92,122,.35); }
  button.danger:hover { background: rgba(255,92,122,.1); border-color: var(--bad); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--text); background: rgba(148,163,184,.08); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: rgba(7,9,13,.7);
    border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; min-height: 40px; min-width: 0; outline: none;
    transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(62,230,196,.15); }
  label.f { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  label.f span.h { color: var(--dim); font-size: 12px; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .check input { min-height: auto; width: 16px; height: 16px; accent-color: var(--accent); }

  /* logs, console, events */
  pre.log { background: rgba(3,5,8,.75); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0;
    height: 380px; overflow: auto; font: 12px/1.55 var(--mono); color: #b9c4d2; white-space: pre-wrap; word-break: break-word; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { min-height: 32px; padding: 5px 12px; font-size: 12.5px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); background: rgba(62,230,196,.08); }
  .events { max-height: 440px; overflow: auto; }
  .ev { display: grid; grid-template-columns: 96px 110px 1fr; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line);
    font-size: 13px; align-items: baseline; }
  .ev .t { color: var(--dim); font: 12px var(--mono); }
  .ev .s { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l-alert { color: var(--bad); } .l-warn { color: var(--warn); } .l-info { color: var(--text); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

  /* wizard */
  .steps { display: flex; gap: 0; margin-bottom: 22px; counter-reset: s; flex-wrap: wrap; }
  .steps div { flex: 1; min-width: 120px; padding: 10px 12px; border-bottom: 2px solid var(--line); color: var(--dim);
    font-size: 13px; font-weight: 550; counter-increment: s; }
  .steps div::before { content: counter(s, decimal-leading-zero) "  "; font-family: var(--mono); }
  .steps div.on { color: var(--text); border-color: var(--accent); }
  .steps div.done { color: var(--muted); border-color: rgba(62,230,196,.4); }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .choice { text-align: left; display: block; padding: 18px; border-radius: var(--r); background: var(--panel); min-height: 0;
    border: 1px solid var(--line); width: 100%; font-weight: 400; }
  .choice:hover { border-color: rgba(62,230,196,.5); background: rgba(62,230,196,.05); }
  .choice.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 40px -12px var(--glow); }
  .choice:disabled { opacity: .45; }
  .choice .t { font-size: 15.5px; font-weight: 620; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .choice p { margin: 0; color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font: 600 10.5px var(--mono); letter-spacing: .5px; padding: 2px 7px; border-radius: 5px;
    background: rgba(148,163,184,.1); color: var(--muted); margin: 8px 6px 0 0; }
  .tag.ok { color: var(--ok); background: rgba(61,220,151,.1); } .tag.warn { color: var(--warn); background: rgba(245,183,79,.1); }
  .wizfoot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

  /* deploy screen */
  .deploy { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  .ring { position: relative; width: 220px; height: 220px; margin: 6px auto 14px; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring .pct { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .pct b { font: 650 42px var(--mono); letter-spacing: -1px; }
  .ring .pct span { color: var(--muted); font-size: 12px; }
  .ring circle.fg, .ring circle.halo { transition: stroke-dashoffset .6s ease; }  /* no filters: cheap on machines without a GPU */
  .ring.busy::after { content: ""; position: absolute; inset: -6px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 80%, rgba(62,230,196,.25) 95%, transparent); animation: spin 2.4s linear infinite;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start; padding: 10px 4px; position: relative; }
  .timeline li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: -6px; width: 1px; background: var(--line2); }
  .timeline .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    border: 1px solid var(--line2); color: var(--dim); background: var(--bg2); position: relative; z-index: 1; }
  .timeline li.done .ic { background: rgba(61,220,151,.15); border-color: var(--ok); color: var(--ok); }
  .timeline li.running .ic { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px var(--glow); }
  .timeline li.running .ic::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
    border-top-color: var(--accent); animation: spin .9s linear infinite; }
  .timeline li.waiting .ic { border-color: var(--warn); color: var(--warn); }
  .timeline li.failed .ic { border-color: var(--bad); color: var(--bad); background: rgba(255,92,122,.12); }
  .timeline li.skipped .ic { color: var(--muted); }
  .timeline .nm { font-weight: 550; } .timeline li.pending .nm { color: var(--dim); }
  .timeline .dt { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .timeline .tm { color: var(--dim); font: 12px var(--mono); }
  .guide { border: 1px solid rgba(245,183,79,.35); background: linear-gradient(180deg, rgba(245,183,79,.08), rgba(245,183,79,.02));
    border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
  .guide h2 { font-size: 17px; margin: 0 0 6px; }
  .guide p { color: #c9d2de; margin: 0 0 12px; }
  .cmd { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .cmd code { flex: 1; font: 13px var(--mono); background: rgba(3,5,8,.8); border: 1px solid var(--line2); border-radius: 9px;
    padding: 10px 12px; overflow-x: auto; white-space: nowrap; color: var(--accent); }
  .alertbox { border: 1px solid rgba(255,92,122,.4); background: rgba(255,92,122,.08); color: #ffd1da; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 14px; white-space: pre-wrap; font-size: 13.5px; }
  .okbox { border: 1px solid rgba(61,220,151,.4); background: rgba(61,220,151,.08); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
  .okbox h2 { margin: 0 0 6px; font-size: 18px; color: var(--ok); }

  /* modal + toast */
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: rgba(3,5,8,.65); backdrop-filter: blur(6px); animation: fade .15s; }
  .modal .box { width: min(460px, 100%); background: #0f141c; border: 1px solid var(--line2); border-radius: 16px; padding: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .modal h2 { margin: 0 0 6px; font-size: 18px; } .modal p { color: var(--muted); margin: 0 0 14px; }
  .modal input:not([type=checkbox]) { width: 100%; margin-bottom: 14px; }
  @keyframes fade { from { opacity: 0; } }
  /* ---- animation: transform/opacity only (cheap without a GPU); plays when a page opens, not on refreshes ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes slidein { from { opacity: 0; transform: translateX(16px); } }
  @keyframes breathe { 50% { opacity: .45; } }
  @keyframes drift { 50% { transform: translate(-30px, 20px) scale(1.08); } }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #view.enter > * { animation: rise .42s cubic-bezier(.2,.75,.25,1) both; }
  #view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; }
  #view.enter > *:nth-child(4) { animation-delay: .12s; } #view.enter > *:nth-child(n+5) { animation-delay: .16s; }
  #view.enter .kpi, #view.enter .grid > .card, #view.enter .choices > .choice, #view.enter .howto > div { animation: rise .45s cubic-bezier(.2,.75,.25,1) both; }
  #view.enter .kpi:nth-child(2), #view.enter .grid > .card:nth-child(2), #view.enter .choices > .choice:nth-child(2), #view.enter .howto > div:nth-child(2) { animation-delay: .05s; }
  #view.enter .kpi:nth-child(3), #view.enter .grid > .card:nth-child(3), #view.enter .choices > .choice:nth-child(3), #view.enter .howto > div:nth-child(3) { animation-delay: .1s; }
  #view.enter .kpi:nth-child(4), #view.enter .grid > .card:nth-child(4), #view.enter .choices > .choice:nth-child(4) { animation-delay: .15s; }
  #view.enter .kpi:nth-child(5), #view.enter .grid > .card:nth-child(5), #view.enter .choices > .choice:nth-child(5) { animation-delay: .2s; }
  #view.enter .kpi:nth-child(n+6), #view.enter .grid > .card:nth-child(n+6), #view.enter .choices > .choice:nth-child(n+6) { animation-delay: .25s; }
  #view.enter .list tbody tr { animation: slidein .35s ease-out both; }
  .modal .box { animation: pop .2s cubic-bezier(.2,.75,.25,1); }
  #toast { animation: slidein .25s ease-out; }
  .ptabs button { transition: color .15s, border-color .2s; }
  .bar i, .gauge i { transition: width .7s cubic-bezier(.2,.75,.25,1); }
  .s-running i { animation: breathe 2.6s ease-in-out infinite; }
  button.primary { transition: transform .12s, filter .15s; } button.primary:hover { transform: translateY(-1px); }
  .choice { transition: border-color .15s, background .15s, transform .18s; } .choice:hover:not(:disabled) { transform: translateY(-2px); }
  .hero::before { content: ""; position: absolute; width: 420px; height: 420px; right: -120px; top: -160px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(124,92,255,.22), transparent 65%); animation: drift 14s ease-in-out infinite; }
  .hero > * { position: relative; }
  .bar, .gauge { position: relative; }
  .timeline li.running .bar::after { content: ""; position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: sheen 1.6s linear infinite; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #toast { position: fixed; right: 20px; bottom: 20px; z-index: 30; max-width: min(420px, calc(100% - 40px)); display: none;
    background: #111821; border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45); }



  /* ---- sign-in and first-run setup ---- */
  .gate { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 20px; overflow: auto; background: var(--bg); }
  .gate::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(700px 420px at 80% 0%, rgba(124,92,255,.18), transparent 60%), radial-gradient(700px 420px at 0% 100%, rgba(62,230,196,.14), transparent 60%); }
  .gate .panel { position: relative; width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line2); border-radius: 20px;
    padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.4); animation: pop .3s cubic-bezier(.2,.75,.25,1); }
  .gate .panel.wide { width: min(680px, 100%); }

<script>
"use strict";
const memPrefs = {};  // used when the window has no browser storage
const pref = (k, d) => { try { const v = localStorage.getItem("manager." + k); if (v) return v; } catch (e) {} return memPrefs[k] || d; };
const setPref = (k, v) => { memPrefs[k] = v; try { localStorage.setItem("manager." + k, v); } catch (e) {} };
function applyTheme() {
  const t = pref("theme", "dark"), sysLight = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = t === "auto" ? (sysLight ? "light" : "dark") : t;
  document.documentElement.dataset.accent = pref("accent", "teal");
}
applyTheme();
// ---------- helpers (all page text goes through textContent: server data can never run as code) ----------
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const fmtUK = (t, o) => new Date(t).toLocaleString("en-GB", { timeZone: "Europe/London", ...o });
const ukTime = iso => fmtUK(iso, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const dur = s => { if (s == null) return "–"; s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${hh}h` : hh ? `${hh}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const ago = s => s == null ? "never" : s < 90 ? Math.round(s) + "s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 172800 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago";
const gb = b => b == null ? "–" : (b / 2 ** 30).toFixed(b > 10 * 2 ** 30 ? 0 : 1) + " GB";
const size = b => b > 2 ** 30 ? gb(b) : b > 2 ** 20 ? (b / 2 ** 20).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
const STATE = { running: "Running", starting: "Starting", stopping: "Stopping", stopped: "Down", maintenance: "Stopped", not_installed: "Not installed", unknown: "Unknown" };
const WHO = { rustctl: "its rustctl.sh watchdog", systemd: "its systemd service", manager: "HostSpawn" };
const ICON = { "Rust": "RS", "Arma Reforger": "AR", "Arma 3": "A3", "DayZ": "DZ", "Valheim": "VH", "Project Zomboid": "PZ" };
const pill = st => h("span", { class: "pill s-" + st }, h("i"), STATE[st] || st);

function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.style.borderLeftColor = bad ? "var(--bad)" : "var(--accent)"; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 6000); }

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Manager": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/login") && !path.startsWith("/api/setup")) { showGate(); throw new Error("Please sign in"); }
  if (!r.ok && r.status !== 202) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

// Typed-confirmation dialog. Resolves to the typed text (or true for a plain confirm), or null if cancelled.
function ask({ title, text, want, okLabel = "Confirm", danger = false, extra }) {
  return new Promise(done => {
    let input = want ? h("input", { placeholder: want, autocomplete: "off", spellcheck: "false" }) : null;
    const ok = h("button", { class: danger ? "danger" : "primary", disabled: !!want }, okLabel);
    const close = v => { m.remove(); done(v); };
    if (input) input.addEventListener("input", () => ok.disabled = input.value.trim().toLowerCase() !== want.toLowerCase());
    ok.onclick = () => close(input ? input.value : true);
    const m = h("div", { class: "modal", onclick: e => { if (e.target === m) close(null); } },
      h("div", { class: "box" }, h("h2", { text: title }), h("p", { text }),
        want ? h("div", { class: "sub", style: "margin:-6px 0 6px" }, "Type ", h("b", { text: want }), " to confirm") : null,
        input, extra || null,
        h("div", { class: "row", style: "justify-content:flex-end" }, h("button", { class: "ghost", onclick: () => close(null) }, "Cancel"), ok)));
    document.body.append(m);
    m.addEventListener("keydown", e => { if (e.key === "Escape") close(null); if (e.key === "Enter" && !ok.disabled) ok.click(); });
    (input || ok).focus();
  });
}

// ---------- data ----------
let data = null, catalog = null, timer = null;
async function loadOverview() {
  try { data = await api("/api/overview"); } catch (e) { return; }
  const live = data.mode === "live";
  $("#community").textContent = data.community || "";
  document.title = (live ? "" : "[DEV] ") + "HostSpawn" + (data.community ? " · " + data.community : "");
  $("#nCount").textContent = data.servers.length || "";
  const hs = data.host, f = $("#hostFoot"); f.replaceChildren();
  const line = (k, v) => f.append(h("div", null, k, h("b", { text: v })));
  line("CPU load", hs.load[0]); line("RAM free", `${(hs.mem_avail_mb / 1024).toFixed(1)} GB`); line("Disk free", `${hs.disk_free_gb} GB`);
  f.append(h("div", { style: "margin-top:8px" }, h("span", { class: "mode mode-" + (live ? "live" : "dev"), text: live ? "LIVE" : "DEV" })));
}
async function loadCatalog() { if (!catalog) catalog = await api("/api/catalog"); return catalog; }

// ---------- shared pieces ----------
function checksRow(s) {
  const ck = s.checks || {}, row = h("div", { class: "checks" }), now = Date.now() / 1000;
  const add = (label, cls, tip) => row.append(h("span", { class: "chk", title: tip }, h("span", { class: "dot " + cls }), label));
  const on = v => v == null ? "" : v ? "ok" : "bad";
  add("Process", on(ck.process), ck.process ? "Server process is running" : "Not running");
  add("Query", on(ck.query), ck.query == null ? "No query check right now" : ck.query ? "Answers server-list queries" : "Not answering queries");
  const r = ck.rcon;
  add("RCON", r == null ? "" : r.ok ? "ok" : "bad", r == null ? "RCON not set up for this server" : r.ok ? "RCON answering" : "RCON: " + (r.error || "not answering"));
  const la = ck.log_age_s;
  add("Log " + (la == null ? "–" : ago(la)), la == null ? "" : la < 600 ? "ok" : "warn", "Last change to the console log");
  const lb = ck.last_backup, bAge = lb ? now - lb : null;
  add("Backup " + ago(bAge), lb == null ? (s.actions.includes("backup") ? "warn" : "") : bAge < 36 * 3600 ? "ok" : "warn",
      lb ? "Newest backup: " + fmtUK(lb * 1000) : "No backup found");
  return row;
}
function statTile(k, v, frac) { return h("div", { class: "stat" }, h("div", { class: "k", text: k }), h("div", { class: "v", text: v }),
  frac != null ? h("div", { class: "bar" }, h("i", { style: `width:${Math.min(100, Math.max(2, frac * 100))}%` })) : null); }
function stats(s) {
  const st = s.status || {};
  return h("div", { class: "stats" },
    statTile("Players", st.players != null ? `${st.players}${st.max_players ? " / " + st.max_players : ""}` : "–", st.players != null && st.max_players ? st.players / st.max_players : null),
    statTile("Server FPS", st.fps != null ? Math.round(st.fps) : "–"),
    statTile("Memory", st.mem_mb ? (st.mem_mb / 1024).toFixed(1) + " GB" : "–"),
    statTile("Uptime", st.uptime || dur(st.uptime_s)),
    statTile("Query", s.health ? `${s.health.ping_ms} ms` : "–"),
    statTile("Restarts", st.restarts != null ? st.restarts : "–"));
}
async function act(s, action, arg = "") {
  const want = (action + " " + arg).trim();
  let confirm = "";
  if (s.confirm.includes(action)) {
    const live = s.supervised_by === "rustctl" ? " Players get an in-game countdown first." : "";
    const title = action === "oxide" ? `${s.framework === "oxide" ? "Update" : "Install"} Oxide on ${s.name}?` : `${want[0].toUpperCase() + want.slice(1)} ${s.name}?`;
    const text = action === "oxide" ? "The server stops, Oxide (uMod) is installed from its official release, and it starts again. Players are disconnected for about a minute."
      : "This affects players on the server." + live;
    confirm = await ask({ title, text, want, okLabel: action === "oxide" ? "Install Oxide" : want, danger: action !== "oxide" });
    if (confirm == null) return;
  }
  try { const r = await api("/api/action", { server: s.id, action, arg, confirm }); toast(r.message || "Done"); }
  catch (e) { toast(e.message, true); }

}
function actionButtons(s) {

  for (const a of ["start", "restart", "stop", "update", "backup"]) if (s.actions.includes(a))
