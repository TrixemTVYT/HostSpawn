name: 💡 Idea
description: Suggest something new for HostSpawn (you can also use /suggest in the Discord)
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like HostSpawn to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
