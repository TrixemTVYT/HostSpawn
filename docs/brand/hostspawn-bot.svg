<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HostSpawn Bot avatar: the HostSpawn server stack with a friendly chat-bubble face. Discord crops it to a circle,
       so everything sits well inside the middle. -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#16303a"/>
      <stop offset="0.55" stop-color="#0f141d"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <radialGradient id="glow" cx="72%" cy="72%" r="40%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f74ff"/>
      <stop offset="1" stop-color="#5b3fe0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- server stack (from the HostSpawn logo) -->
  <g fill="none" stroke="#3ee6c4" stroke-width="22" stroke-linecap="round">
    <rect x="112" y="128" width="236" height="68" rx="20"/>
    <rect x="112" y="220" width="236" height="68" rx="20"/>
    <rect x="112" y="312" width="236" height="44" rx="18" opacity=".45"/>
  </g>
  <circle cx="156" cy="162" r="14" fill="#7c5cff"/>
  <circle cx="156" cy="254" r="14" fill="#7c5cff"/>

  <!-- chat bubble with a bot face -->
  <g transform="translate(262 262)">
    <path d="M28 0h112a28 28 0 0 1 28 28v72a28 28 0 0 1-28 28H74l-34 28v-28H28A28 28 0 0 1 0 100V28A28 28 0 0 1 28 0z"
          fill="url(#bubble)" stroke="#07090d" stroke-width="10" stroke-linejoin="round"/>
    <line x1="84" y1="0" x2="84" y2="-22" stroke="#8f74ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="84" cy="-30" r="12" fill="#f5b74f" stroke="#07090d" stroke-width="6"/>
    <circle cx="56" cy="56" r="13" fill="#e6fff8"/>
    <circle cx="112" cy="56" r="13" fill="#e6fff8"/>
    <path d="M58 90q26 18 52 0" fill="none" stroke="#e6fff8" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
